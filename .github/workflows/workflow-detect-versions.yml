name: Detect and Build Minecraft Bedrock Versions

on:
  schedule:
    # Run hourly to check for new versions
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      stable-version: ${{ steps.detect.outputs.stable-version }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Minecraft Bedrock Versions
        id: detect
        uses: TartarusCode/detect-bedrock-version@v1.0.2
        with:
          output-file: 'versions.json'

      - name: Commit and push versions.json
        if: steps.detect.outputs.has-changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add versions.json
          git commit -m "Update Minecraft Bedrock versions"
          git push

  build-versions:
    needs: detect-versions
    runs-on: ubuntu-latest
    if: needs.detect-versions.outputs.has-changes == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate identifiers
        id: ids
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          owner_lower=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          app_name=$(echo "${GITHUB_REPOSITORY}" | grep -P -o -m 1 '(?<=/arch-).*')
          echo "repo_lower=${repo_lower}" >> "${GITHUB_OUTPUT}"
          echo "owner_lower=${owner_lower}" >> "${GITHUB_OUTPUT}"
          echo "app_name=${app_name}" >> "${GITHUB_OUTPUT}"

      - name: Check registry credentials
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CR_PAT: ${{ secrets.CR_PAT }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ] && [ -n "${CR_PAT}" ]; then
            echo "push-enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "push-enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.registry.outputs.push-enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.registry.outputs.push-enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.ids.outputs.owner_lower }}
          password: ${{ secrets.CR_PAT }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.registry.outputs.push-enabled == 'true' }}
          build-args: |
            APPNAME=${{ steps.ids.outputs.app_name }}
            RELEASETAG=${{ needs.detect-versions.outputs.stable-version }}
          tags: |
            docker.io/${{ steps.ids.outputs.repo_lower }}:${{ needs.detect-versions.outputs.stable-version }}
            docker.io/${{ steps.ids.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.ids.outputs.repo_lower }}:${{ needs.detect-versions.outputs.stable-version }}
            ghcr.io/${{ steps.ids.outputs.repo_lower }}:latest
