name: Detect and Build Minecraft Bedrock Versions

on:
  schedule:
    # Run hourly to check for new versions
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      stable-version: ${{ steps.detect.outputs.stable-version }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Minecraft Bedrock Versions
        id: detect
        uses: jedipunkz/detect-minecraft-versions@v1.0.0
        with:
          output-file: 'versions.json'

      - name: Commit and push versions.json
        if: steps.detect.outputs.has-changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add versions.json
          git commit -m "Update Minecraft Bedrock versions"
          git push

  build-versions:
    needs: detect-versions
    runs-on: ubuntu-latest
    if: needs.detect-versions.outputs.has-changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate app name
        id: app-name
        run: |
          app_name=$(echo "${GITHUB_REPOSITORY}" | grep -P -o -m 1 '(?<=/arch-).*')
          echo "app_name=${app_name}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APPNAME=${{ steps.app-name.outputs.app_name }}
            RELEASETAG=${{ needs.detect-versions.outputs.stable-version }}
          tags: |
            docker.io/${{ github.repository }}:${{ needs.detect-versions.outputs.stable-version }}
            docker.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.detect-versions.outputs.stable-version }}
            ghcr.io/${{ github.repository }}:latest
